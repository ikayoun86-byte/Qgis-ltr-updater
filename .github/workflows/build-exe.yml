name: build-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # --onedir (pas --onefile) : un exécutable "onefile" se ré-extrait dans
      # un dossier temporaire à chaque lancement (démarrage lent, plus souvent
      # bloqué par l'antivirus) et a des soucis de fiabilité documentés avec
      # WebView2. --onedir démarre directement depuis le disque.
      - run: >
          pyinstaller
          --onedir
          --windowed
          --name QGIS-LTR-Updater
          --add-data "qgis_ltr_updater/assets;assets"
          --exclude-module pythonnet
          --exclude-module clr_loader
          --exclude-module clr
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: QGIS-LTR-Updater-windows
          path: dist/QGIS-LTR-Updater/
          retention-days: 30
