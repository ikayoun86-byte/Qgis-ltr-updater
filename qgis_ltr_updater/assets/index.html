<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>QGIS LTR Updater</title>
<style>
  :root {
    --bg: #eef0ee;
    --surface: #ffffff;
    --surface-2: #e4e7e2;
    --border: rgba(20, 30, 25, 0.12);
    --text: #171a16;
    --text-dim: #5b625b;
    --accent: #9a5b1e;
    --accent-strong: #7c4917;
    --accent-ink: #fff8ef;
    --good: #1f8a55;
    --good-bg: rgba(31, 138, 85, 0.10);
    --warn: #9a6a12;
    --warn-bg: rgba(154, 106, 18, 0.12);
    --danger: #c22f45;
    --danger-bg: rgba(194, 47, 69, 0.10);
    --radius-card: 14px;
    --radius-pill: 100px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161a;
      --surface: #1b2026;
      --surface-2: #222830;
      --border: rgba(255, 255, 255, 0.09);
      --text: #eef1f4;
      --text-dim: #9aa4ad;
      --accent: #d99a4e;
      --accent-strong: #f0b46a;
      --accent-ink: #1b1206;
      --good: #6fe0a8;
      --good-bg: rgba(111, 224, 168, 0.12);
      --warn: #e8b755;
      --warn-bg: rgba(232, 183, 85, 0.14);
      --danger: #f2596c;
      --danger-bg: rgba(242, 89, 108, 0.14);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 22px 26px 18px;
    gap: 16px;
  }

  header.brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mark {
    flex: none;
    width: 34px;
    height: 34px;
    color: var(--accent);
  }

  .brand-text .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .brand-text h1 {
    margin: 1px 0 0;
    font-family: "Bahnschrift SemiBold", "Bahnschrift", "Segoe UI Semibold", sans-serif;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: rise 0.28s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-top .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .pill.state-loading { background: var(--surface-2); color: var(--text-dim); }
  .pill.state-ok { background: var(--good-bg); color: var(--good); }
  .pill.state-update { background: var(--warn-bg); color: var(--warn); }
  .pill.state-busy { background: var(--warn-bg); color: var(--warn); }
  .pill.state-done { background: var(--good-bg); color: var(--good); }
  .pill.state-error { background: var(--danger-bg); color: var(--danger); }

  .pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .pill.state-busy .dot,
  .pill.state-loading .dot {
    animation: pulse 1.1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .pill .dot { animation: none; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .versions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .version-block { flex: 1; min-width: 0; }

  .version-block .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .version-block .value {
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .version-block.is-latest .value { color: var(--accent); }

  .arrow {
    flex: none;
    width: 20px;
    height: 20px;
    color: var(--text-dim);
    margin-top: 16px;
  }

  .note {
    font-size: 12.5px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .note strong { color: var(--text); font-weight: 600; }

  .actions {
    display: flex;
    gap: 10px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-pill);
    padding: 11px 22px;
    font-weight: 600;
    font-size: 13.5px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { cursor: default; opacity: 0.55; transform: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    flex: 1;
  }

  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .log-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    background: var(--surface);
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.2s ease;
  }
  .log-wrap.open { max-height: 1000px; opacity: 1; flex: 1; }
  @media (prefers-reduced-motion: reduce) {
    .log-wrap { transition: none; }
  }

  .log-wrap .log-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 10px 14px 0;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px 12px;
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-dim);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #log .line.ok { color: var(--good); }
  #log .line.error { color: var(--danger); }

  footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
</style>
</head>
<body>
  <div class="app">
    <header class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16 4 L27 26 H5 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="16" cy="18" r="2.4" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <div class="eyebrow">Outil SIG &middot; Équipe</div>
        <h1>QGIS LTR Updater</h1>
      </div>
    </header>

    <section class="card">
      <div class="card-top">
        <span class="label">État de la version LTR</span>
        <span id="pill" class="pill state-loading"><span class="dot"></span><span id="pill-text">Vérification…</span></span>
      </div>

      <div class="versions">
        <div class="version-block">
          <div class="label">Installée</div>
          <div id="current" class="value">—</div>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="version-block is-latest">
          <div class="label">Dernière LTR publiée</div>
          <div id="latest" class="value">—</div>
        </div>
      </div>

      <div id="note" class="note" hidden></div>

      <div class="actions">
        <button id="btn-install" class="primary" disabled>Vérification…</button>
        <button id="btn-refresh" class="secondary">Revérifier</button>
      </div>
    </section>

    <div id="log-wrap" class="log-wrap">
      <div class="log-title">Journal</div>
      <div id="log"></div>
    </div>

    <footer>
      <span>QGIS LTR Updater</span>
      <span>Conserve toujours n et n-1</span>
    </footer>
  </div>

<script>
  const pillEl = document.getElementById('pill');
  const pillTextEl = document.getElementById('pill-text');
  const currentEl = document.getElementById('current');
  const latestEl = document.getElementById('latest');
  const noteEl = document.getElementById('note');
  const btnInstall = document.getElementById('btn-install');
  const btnRefresh = document.getElementById('btn-refresh');
  const logWrap = document.getElementById('log-wrap');
  const logEl = document.getElementById('log');

  let lastPlan = null;

  function setPill(kind, text) {
    pillEl.className = 'pill state-' + kind;
    pillTextEl.textContent = text;
  }

  function appendLog(message, kind) {
    logWrap.classList.add('open');
    const line = document.createElement('div');
    line.className = 'line' + (kind ? ' ' + kind : '');
    line.textContent = message;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  window.onLog = function (message) {
    appendLog(message);
  };

  function renderPlan(plan) {
    lastPlan = plan;
    currentEl.textContent = plan.current || '(aucune)';
    latestEl.textContent = plan.latest;

    if (plan.needs_update) {
      setPill('update', 'Mise à jour disponible');
      btnInstall.textContent = 'Installer ' + plan.latest;
      btnInstall.disabled = false;
      if (plan.a_retirer && plan.a_retirer.length) {
        noteEl.innerHTML = '<strong>' + plan.a_retirer.join(', ') + '</strong> sera retirée après l’installation, pour ne garder que la version actuelle et la nouvelle.';
        noteEl.hidden = false;
      } else {
        noteEl.hidden = true;
      }
    } else {
      setPill('ok', 'À jour');
      btnInstall.textContent = 'Installer';
      btnInstall.disabled = true;
      noteEl.hidden = true;
    }
  }

  async function refreshStatus() {
    setPill('loading', 'Vérification…');
    btnInstall.disabled = true;
    btnInstall.textContent = 'Vérification…';
    try {
      const plan = await window.pywebview.api.get_status();
      if (plan.error) {
        setPill('error', 'Erreur');
        appendLog('Erreur : ' + plan.error, 'error');
        btnInstall.textContent = 'Installer';
        return;
      }
      renderPlan(plan);
    } catch (err) {
      setPill('error', 'Erreur');
      appendLog('Erreur inattendue : ' + err, 'error');
    }
  }

  function setBusy(busy) {
    btnInstall.disabled = busy;
    btnRefresh.disabled = busy;
  }

  async function onInstallClick() {
    if (!lastPlan || !lastPlan.needs_update) return;
    setBusy(true);
    setPill('busy', 'Installation en cours…');
    btnInstall.textContent = 'Installation en cours…';
    logWrap.classList.add('open');

    try {
      const result = await window.pywebview.api.install();
      if (result.restarting) {
        appendLog('Droits administrateur requis : redémarrage en cours...');
        return; // la fenêtre va se fermer côté Python
      }
      if (!result.ok) {
        setPill('error', 'Erreur');
        appendLog('Erreur : ' + result.error, 'error');
        setBusy(false);
        btnInstall.textContent = 'Réessayer';
        return;
      }
      setPill('done', 'Installé');
      appendLog('Terminé avec succès.', 'ok');
      setBusy(false);
      await refreshStatus();
    } catch (err) {
      setPill('error', 'Erreur');
      appendLog('Erreur inattendue : ' + err, 'error');
      setBusy(false);
    }
  }

  btnInstall.addEventListener('click', onInstallClick);
  btnRefresh.addEventListener('click', refreshStatus);

  window.addEventListener('pywebviewready', refreshStatus);
</script>
</body>
</html>
